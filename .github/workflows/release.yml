name: Release

# "v" ile başlayan bir etiket gönderilince (ör. v1.0.1) imzalı APK'yı derleyip bu deponun
# GitHub Releases sayfasında "Animke.apk" olarak yayınlar. Sitedeki indirme düğmesi
# releases/latest/download/Animke.apk adresini kullanır.
#
#   1) package.json'daki "version"ı artır (ör. 1.0.1)
#   2) git commit -am "1.0.1" && git tag v1.0.1 && git push --follow-tags
#
# İmzalama anahtarı yoksa (gizli değişkenler girilmemişse) yalnızca deneme APK'sı
# derlenir ve Actions sayfasına "artifact" olarak eklenir; yayın yapılmaz.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Install dependencies
        run: npm ci

      - name: Check version matches tag
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          v=$(node -p "require('./package.json').version")
          if [ "v$v" != "$GITHUB_REF_NAME" ]; then
            echo "::error::package.json sürümü ($v) etiketle ($GITHUB_REF_NAME) aynı değil."
            exit 1
          fi

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Prepare signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/animke.p12"
            echo "ANDROID_KEYSTORE_FILE=$RUNNER_TEMP/animke.p12" >> "$GITHUB_ENV"
            echo "SIGNED=1" >> "$GITHUB_ENV"
          else
            echo "::warning::İmzalama anahtarı yok: yalnızca deneme APK'sı derlenecek."
          fi

      - name: Build APK
        working-directory: android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          chmod +x gradlew
          if [ "$SIGNED" = "1" ]; then
            ./gradlew assembleRelease --no-daemon
            cp app/build/outputs/apk/release/app-release.apk ../Animke.apk
          else
            ./gradlew assembleDebug --no-daemon
            cp app/build/outputs/apk/debug/app-debug.apk ../Animke-deneme.apk
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: animke-apk
          path: Animke*.apk

      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/') && env.SIGNED == '1'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || gh release create "$GITHUB_REF_NAME" \
            --title "Animke Android ${GITHUB_REF_NAME#v}" \
            --notes "Android uygulaması: **Animke.apk**. Telefonda indirip açın; ilk kurulumda \"bilinmeyen kaynaklara izin ver\" istenebilir."
          gh release upload "$GITHUB_REF_NAME" Animke.apk --clobber
